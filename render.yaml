services:
  - type: web
    name: sherubtse-remarket
    runtime: node
    buildCommand: npm ci
    # server.js runs locked, checksum-verified migrations and indexes on every boot.
    # This also works for service plans that do not support pre-deploy commands.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_BASE_URL
        # Public origin confirmed by the operator; not a credential.
        value: https://sherubtse-remarket.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: ""
